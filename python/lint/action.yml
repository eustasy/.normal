name: Normal Python Lint
description: Lint and format-check Python with ruff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0

    - name: Lint (ruff)
      shell: bash
      run: qlty check --all --no-formatters --filter=ruff

    - name: Format check (ruff)
      shell: bash
      run: qlty check --all --filter=ruff
