name: Normal Python Lint
description: Lint and format-check Python with ruff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

    - name: Lint (ruff)
      shell: bash
      run: qlty check --all --no-formatters --filter=ruff

    - name: Format check (ruff)
      shell: bash
      run: qlty check --all --filter=ruff
