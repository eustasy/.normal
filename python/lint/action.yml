name: Normal Python Lint
description: Lint and format-check Python with ruff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@357cd88be7c73c5dc45cf7cf8f99a46ec0b62b73 # v2.6.0

    - name: Lint (ruff)
      shell: bash
      run: qlty check --all --no-formatters --filter=ruff

    - name: Format check (ruff)
      shell: bash
      run: qlty check --all --filter=ruff
