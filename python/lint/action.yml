name: Normal Python Lint
description: Lint and format-check Python with ruff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

    - name: Lint (ruff)
      shell: bash
      run: qlty check --all --no-formatters --filter=ruff

    - name: Format check (ruff)
      shell: bash
      run: qlty check --all --filter=ruff
