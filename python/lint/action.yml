name: Normal Python Lint
description: Lint and format-check Python with ruff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0

    - name: Lint (ruff)
      shell: bash
      run: qlty check --all --no-formatters --filter=ruff

    - name: Format check (ruff)
      shell: bash
      run: qlty check --all --filter=ruff
