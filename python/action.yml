name: Normal Python
description: Set up Python, then lint and format-check it.

inputs:
  python-version:
    description: Python version passed to the setup action.
    required: true

runs:
  using: composite
  steps:
    - uses: eustasy/.normal/python/setup@v4
      with:
        python-version: ${{ inputs.python-version }}

    - uses: eustasy/.normal/python/lint@v4
