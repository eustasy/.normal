name: Normal JSON
description: Format-check JSON with prettier.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0

    - name: Format check (prettier)
      shell: bash
      run: git ls-files -- '*.json' | xargs -r qlty check --filter=prettier
