name: Normal JSON
description: Format-check JSON with prettier.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

    - name: Format check (prettier)
      shell: bash
      run: git ls-files -- '*.json' | xargs -r qlty check --filter=prettier
