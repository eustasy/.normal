name: Normal JSON
description: Format-check JSON with prettier.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

    - name: Format check (prettier)
      shell: bash
      run: git ls-files -- '*.json' | xargs -r qlty check --filter=prettier
