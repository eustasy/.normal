name: Normal JSON
description: Format-check JSON with prettier.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@357cd88be7c73c5dc45cf7cf8f99a46ec0b62b73 # v2.6.0

    - name: Format check (prettier)
      shell: bash
      run: git ls-files -- '*.json' | xargs -r qlty check --filter=prettier
