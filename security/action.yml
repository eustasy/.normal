name: Normal Security
description: Scan for secrets, vulnerable dependencies and known CVEs.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

    - name: Security scan
      # gitleaks needs full history, so the caller must check out with
      # fetch-depth: 0.
      shell: bash
      run: qlty check --all --no-formatters --filter=gitleaks,trivy,osv-scanner
