# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    # github-actions scans <directory> literally for .github/workflows/ and for
    # action.yml, so every path has to be named: "/" = this repo's own
    # workflows; "/configs/.github/workflows" = the deployable templates; the
    # rest are the composite actions, which is where every hash-pinned
    # third-party action now lives. test/run.sh asserts this list stays complete.
    directories:
      - "/"
      - "/configs/.github/workflows"
      - "/actions"
      - "/css"
      - "/env"
      - "/html"
      - "/js"
      - "/js/lint"
      - "/js/setup"
      - "/js/test"
      - "/json"
      - "/md"
      - "/php"
      - "/php/lint"
      - "/php/setup"
      - "/php/test"
      - "/python"
      - "/python/lint"
      - "/python/setup"
      - "/python/test"
      - "/security"
      - "/sh"
      - "/sql"
      - "/xml"
      - "/yaml"
    schedule:
      interval: "daily"
    groups:
      gha-patching:
        update-types:
          - "minor"
          - "patch"
