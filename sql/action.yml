name: Normal SQL
description: Lint and format-check SQL with sqlfluff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

    - name: Lint + format check (sqlfluff)
      shell: bash
      run: qlty check --all --filter=sqlfluff
