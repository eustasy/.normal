name: Normal SQL
description: Lint and format-check SQL with sqlfluff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

    - name: Lint + format check (sqlfluff)
      shell: bash
      run: qlty check --all --filter=sqlfluff
