name: Normal SQL
description: Lint and format-check SQL with sqlfluff.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0

    - name: Lint + format check (sqlfluff)
      shell: bash
      run: qlty check --all --filter=sqlfluff
