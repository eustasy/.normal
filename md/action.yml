name: Normal Markdown
description: Lint and format-check Markdown with markdownlint.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0

    - name: Lint + format check (markdownlint)
      shell: bash
      run: qlty check --all --filter=markdownlint
