name: Normal Actions
description: Lint GitHub Actions workflows with actionlint and zizmor.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

    - name: Lint (actionlint, zizmor)
      shell: bash
      run: qlty check --all --no-formatters --filter=actionlint,zizmor
