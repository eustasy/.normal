name: Normal HTML
description: Validate HTML with html-validate.

inputs:
  node-version:
    description: Node.js version passed to the setup action.
    default: lts/*

runs:
  using: composite
  steps:
    - uses: eustasy/.normal/js/setup@v5
      with:
        node-version: ${{ inputs.node-version }}
        install: "false"

    - name: Lint (html-validate)
      shell: bash
      # Pinned: npx would otherwise fetch whatever html-validate is latest on
      # every run. Dependabot does not track this; bump it by hand.
      run: git ls-files -- '*.html' '*.htm' | xargs -r npx --yes html-validate@11.21.0 --config .qlty/configs/.htmlvalidate.json
