name: Normal HTML
description: Validate HTML with html-validate.

inputs:
  node-version:
    description: Node.js version passed to the setup action.
    default: lts/*

runs:
  using: composite
  steps:
    - uses: eustasy/.normal/js/setup@v4
      with:
        node-version: ${{ inputs.node-version }}
        install: "false"

    - name: Lint (html-validate)
      shell: bash
      run: git ls-files -- '*.html' '*.htm' | xargs -r npx --yes html-validate --config .qlty/configs/.htmlvalidate.json
