name: Normal PHP
description: Set up PHP, then lint and format-check it.

inputs:
  php-version:
    description: PHP version passed to the setup action.
    required: true
  extensions:
    description: Comma-separated PHP extensions to enable, for example "gd".
    default: ""

runs:
  using: composite
  steps:
    - uses: eustasy/.normal/php/setup@v4
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none

    - uses: eustasy/.normal/php/lint@v4
