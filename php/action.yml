name: Normal PHP
description: Lint PHP with phpstan and format-check it with php-cs-fixer.

inputs:
  php-version:
    description: PHP version passed to shivammathur/setup-php.
    required: true
  extensions:
    description: Comma-separated PHP extensions to enable, for example "gd".
    default: ""

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none

    - name: Install dependencies
      # A PHP repo with no composer.json must not hard-fail here.
      if: hashFiles('composer.json') != ''
      shell: bash
      run: composer install --no-interaction --prefer-dist

    - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

    - name: Lint (phpstan)
      shell: bash
      run: qlty check --all --no-formatters --filter=phpstan

    - name: Format check (php-cs-fixer)
      shell: bash
      run: qlty check --all --filter=php-cs-fixer
