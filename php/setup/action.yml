name: Normal PHP Setup
description: Set up PHP and install Composer dependencies when a manifest is present.

inputs:
  php-version:
    description: PHP version passed to shivammathur/setup-php.
    required: true
  extensions:
    description: Comma-separated PHP extensions to enable, for example "mysqli, gd".
    default: ""
  coverage:
    description: Coverage driver, one of none, pcov or xdebug.
    default: none
  tools:
    description: Comma-separated tools for setup-php to install, for example "composer:v2".
    default: ""

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: ${{ inputs.tools }}

    - name: Install dependencies
      # A PHP repo with no composer.json must not hard-fail here.
      if: hashFiles('composer.json') != ''
      shell: bash
      run: composer install --no-interaction --prefer-dist
