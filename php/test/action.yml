name: Normal PHP Test
description: Run the PHP test suite and upload coverage to Qlty.

inputs:
  coverage-token:
    description: Qlty coverage token, normally secrets.QLTY_COVERAGE_TOKEN.
    required: true
  upload:
    # No ${{ }} in this description. GitHub evaluates expressions in an action
    # manifest, where `matrix` is out of scope, and the manifest fails to load.
    description: >-
      Upload coverage. A matrix job should send "true" for one leg only — compare
      matrix.php-version against the leg that should upload.
    default: "true"
  command:
    description: Command that runs the tests and writes coverage.
    default: vendor/bin/phpunit --coverage-clover coverage/clover.xml
  files:
    description: Coverage files to upload. Accepts more than one.
    default: coverage/clover.xml

runs:
  using: composite
  steps:
    - name: Run PHPUnit with coverage
      shell: bash
      # Via env, not interpolated: zizmor flags `run: ${{ inputs.* }}` as
      # template-injection.
      env:
        NORMAL_TEST_COMMAND: ${{ inputs.command }}
      run: bash -eo pipefail -c "$NORMAL_TEST_COMMAND"

    - name: Upload coverage to Qlty
      if: inputs.upload == 'true'
      uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
      with:
        # Upstream renamed this input; `coverage-token` is deprecated and warns.
        token: ${{ inputs.coverage-token }}
        files: ${{ inputs.files }}
