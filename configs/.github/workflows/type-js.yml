# eustasy/.Normal 4.0beta13
name: "Type: TS"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/type-js.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/type-js.yml"

permissions:
  contents: read

jobs:
  type-js:
    # Remove the `if: false` below to activate this workflow.
    if: false
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/js/setup@v4

      - name: Typecheck (tsc)
        # Replace with your own script if the project wraps tsc, for example
        # `npm run typecheck`.
        run: npx tsc --noEmit
