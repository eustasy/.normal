name: Normal JavaScript
description: Set up Node, then lint and format-check JS and TS.

inputs:
  node-version:
    description: Node.js version passed to the setup action.
    default: lts/*

runs:
  using: composite
  steps:
    - uses: eustasy/.normal/js/setup@v4
      with:
        node-version: ${{ inputs.node-version }}

    - uses: eustasy/.normal/js/lint@v4
