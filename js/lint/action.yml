name: Normal JavaScript Lint
description: Lint JS and TS with oxc and knip, and format-check with prettier.

runs:
  using: composite
  steps:
    - uses: qltysh/qlty-action/install@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0

    - name: Lint (oxc, knip)
      shell: bash
      run: qlty check --all --no-formatters --filter=oxc,knip

    - name: Format check (prettier)
      shell: bash
      run: git ls-files -- '*.js' '*.ts' '*.mjs' '*.cjs' '*.mts' '*.cts' | xargs -r qlty check --filter=prettier
