name: Normal XML
description: Validate XML well-formedness with xmllint.

runs:
  using: composite
  steps:
    - name: Install xmllint
      shell: bash
      # The runner image ships stale apt lists, so install alone can 404.
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils

    - name: Lint XML (xmllint)
      shell: bash
      run: git ls-files -- '*.xml' | xargs -r xmllint --noout
